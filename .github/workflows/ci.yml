name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Synchronize environment
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest

      - name: Import contracts
        run: uv run lint-imports

      - name: Lint
        run: uvx ruff check src tests

      - name: Types
        run: uv run --with pyright pyright

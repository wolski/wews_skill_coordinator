# Skills Coordinator configuration
# Profiles are composable and are the authoritative skill inventory.
# Local sources use owner/repository@<category>/skills/<name> exact paths.
# Npx packages use owner/repository@skill-name selectors.

[plugins.claude-plugins-official]
names = ["code-simplifier", "claude-md-management", "code-review", "hookify"]

# Packages installed from a working copy on this machine. Their skills are
# symlinked, so editing the source is live at once for Claude Code and Codex.
# Every package absent from this table is installed with the pinned npx CLI.
[sources."wolski/wews_skill_coordinator"]
path = "skills"
owned = true

[sources."fgcz/skills"]
path = "repos/fgcz-skills"
git_url = "https://github.com/fgcz/skills.git"

[profiles.full]
description = "Every configured skill profile."
includes = ["*"]

[profiles.python-design]
description = "Wolski's Python style and bounded design guidance, plus public Clean Architecture."
skills = [
    "wolski/wews_skill_coordinator@software-engineering/skills/python-style-guide",
    "wolski/wews_skill_coordinator@software-engineering/skills/design-principles",
    "wolski/wews_skill_coordinator@software-engineering/skills/polymorphism-over-discrimination",
    "wolski/wews_skill_coordinator@software-engineering/skills/directed-folder-imports",
    "pproenca/dot-skills@clean-architecture",
]

[profiles.python-design-public]
description = "Public Python design-pattern and Clean Architecture guidance, without Wolski skills."
skills = [
    "wshobson/agents@python-design-patterns",
    "pproenca/dot-skills@clean-architecture",
]


# Skills Coordinator configuration
# Profiles are composable and are the authoritative skill inventory.
# Each skill uses owner/repository@skill-name notation.

[plugins.claude-plugins-official]
names = ["code-simplifier", "claude-md-management", "code-review", "hookify"]

[package_options."wolski/claude-kaiser-skills"]
full_depth = true

# npx manages skills, but not standalone Claude Code agent definitions.
[agent_sources.claude-kaiser-skills]
repository = "https://github.com/wolski/claude-kaiser-skills.git"
agents = ["agents/r-development.md", "agents/dry-audit.md", "agents/dead-code-audit.md"]

[profiles.full]
description = "Every configured profile and standalone Claude agent."
includes = ["*"]
agents = ["*"]

[profiles.python-design]
description = "Wolski's Python style and bounded design guidance, plus public Clean Architecture."
skills = [
    "wolski/claude-kaiser-skills@python-style-guide",
    "wolski/claude-kaiser-skills@design-principles",
    "wolski/claude-kaiser-skills@polymorphism-over-discrimination",
    "pproenca/dot-skills@clean-architecture",
]

[profiles.python-design-public]
description = "Public Python design-pattern and Clean Architecture guidance, without Wolski skills."
skills = [
    "wshobson/agents@python-design-patterns",
    "pproenca/dot-skills@clean-architecture",
]

[profiles.marimo]
description = "Marimo notebook authoring, migration, widgets, batch execution, and background jobs."
skills = [
    "marimo-team/skills@marimo-notebook",
    "marimo-team/skills@marimo-batch",
    "marimo-team/skills@streamlit-to-marimo",
    "marimo-team/skills@jupyter-to-marimo",
    "marimo-team/skills@anywidget-generator",
    "marimo-team/skills@wasm-compatibility",
    "marimo-team/skills@add-molab-badge",
    "marimo-team/skills@implement-paper",
    "wolski/claude-kaiser-skills@marimo-background-jobs",
]


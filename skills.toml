# Skills Coordinator configuration — read by `coord`.
# `active` is the profile `coord install` installs.
active = "python-bfabric-proteomics"

[plugins.claude-plugins-official]
names = ["code-simplifier", "claude-md-management", "code-review", "hookify"]

# Sources: a short name per repository, used as the key in profiles.
# With `path`, skills are symlinked from that working copy, so edits are live
# at once; list them as <category>/<name>. Without `path`, the package is
# installed with the pinned npx CLI; list skills by name.

[sources.wews]
repo = "wolski/wews_skill_coordinator"
path = "skills"
owned = true

[sources.fgcz]
repo = "fgcz/skills"
path = "repos/fgcz-skills"
git_url = "https://github.com/fgcz/skills.git"

[sources.marimo]
repo = "marimo-team/skills"

[sources.deepmind]
repo = "google-deepmind/science-skills"

[sources.posit]
repo = "posit-dev/skills"

[sources.anthropic]
repo = "anthropics/skills"

[sources.agent-rules]
repo = "netresearch/agent-rules-skill"

[sources.wshobson]
repo = "wshobson/agents"

# Compositions: what you install. A composition lists base profiles only and
# is never included by another profile. `full` includes every base profile.

[profiles.full]
description = "Every base profile."
includes = ["*"]

[profiles.python-bfabric-proteomics]
description = "Daily FGCZ work: Python design and workflow, B-Fabric, proteomics/PTM analysis."
includes = [
    "python-design",
    "workflow",
    #"scientific-python",
    "fgcz-communication",
    "fgcz-bfabric-lims",
    "fgcz-proteomics-data-analysis",
    "meta",
    "communication",
]

[profiles.python]
description = "Python design, workflow tooling, and plotting."
includes = [
    "python-design",
    "workflow",
    "scientific-python",
]

[profiles.science]
description = "Scientific Python plus literature, sequence, structure, and pathway databases."
includes = [
    "scientific-python",
    "science-databases",
]

[profiles.fgcz]
description = "Every FGCZ source folder."
includes = [
    "fgcz-bfabric-lims",
    "fgcz-communication",
    "fgcz-infrastructure",
    "fgcz-meta-skills",
    "fgcz-proteomics-data-analysis",
]

# Base profiles: concrete skills, listed under their source's short name.
# Every skill has exactly one base profile.

[profiles.python-design]
description = "Wolski's bounded Python design guidance."
wews = [
    "software-engineering/constructor-or-dataclass",
    #"software-engineering/design-principles",
    "software-engineering/polymorphism-over-discrimination",
    "software-engineering/directed-folder-imports",
    "software-engineering/polars-first",
]

[profiles.python-style]
description = "Wolski's Python style guide, kept out of the default profiles."
wews = ["software-engineering/python-style-guide"]

[profiles.python-design-public]
description = "Public Python design-pattern guidance, without Wolski skills."
wshobson = ["python-design-patterns"]

[profiles.workflow]
description = "Pipelines and environments: Snakemake, mixed R/Python packaging, shell, pixi, uv."
wews = [

    "workflow-development/snakemake-compact",
    "workflow-development/shell-scripting",
    #"workflow-development/pixi-package-manager",
]
deepmind = ["uv"]

[profiles.scientific-python]
description = "Single-cell analysis and Plotly visualisation."
